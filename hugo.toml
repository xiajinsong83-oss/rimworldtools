baseURL = "https://www.rimworldtools.com/"
title = "RimWorld Tools — Colony Planning Calculators & Guides"
languageCode = "en-us"
enableRobotsTXT = true
enableGitInfo = false

# 站点声明：非官方粉丝站
copyright = "© 2026 RimWorld Tools · Fan site, not affiliated with Ludeon Studios · Powered by fansweb"

[params]
  adsensePublisher = "ca-pub-3866829862674413"
  siteName = "RimWorld Tools"
  siteTagline = "RimWorld 1.6 & Odyssey colony planning calculators, trait tools, seeds, MOD guides and FAQs."
  fanSiteNotice = "This is a fan-made guide site. RimWorld is a trademark of Ludeon Studios. We are not affiliated with or endorsed by Ludeon Studios."

# Google AdSense 广告位（两个真实广告单元：001=2718556812 内容页，002=5833026503 工具页）
[params.ads]
  headerSlot = "2718556812"
  toolsSlot = "5833026503"
  contentSlot = "2718556812"

# 多语言：默认英文，德语（Tier1 第二大流量池）、法语、简体中文
[languages]
  [languages.en]
    languageCode = "en-us"
    weight = 1
    title = "RimWorld Tools — Calculators & Guides"
    [languages.en.params]
      siteTagline = "RimWorld 1.6 & Odyssey colony planning calculators, trait tools, seeds, MOD guides and FAQs."
  [languages.zh-hans]
    languageCode = "zh-cn"
    weight = 2
    title = "RimWorld Tools 环世界工具与攻略"
    [languages.zh-hans.params]
      siteTagline = "环世界 1.6 与 Odyssey 殖民地规划计算器、特性工具、种子、MOD 指南与 FAQ。"
  [languages.de]
    languageCode = "de-de"
    weight = 3
    contentDir = "content/de"
    title = "RimWorld Tools — Rechner & Anleitungen"
    [languages.de.params]
      siteTagline = "RimWorld 1.6 & Odyssey Kolonie-Planungsrechner, Merkmal-Tools, Seeds, MOD-Anleitungen und FAQs."
  [languages.fr]
    languageCode = "fr-fr"
    weight = 4
    contentDir = "content/fr"
    title = "RimWorld Tools — Calculateurs & Guides"
    [languages.fr.params]
      siteTagline = "Calculateurs de planification de colonie RimWorld 1.6 & Odyssey, outils de traits, seeds, guides MOD et FAQ."

# 输出配置：HTML + RSS + sitemap
[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.RSS]
    mediatype = "application/rss"
    baseName = "index"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
