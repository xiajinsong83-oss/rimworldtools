# RimWorld Hospital, Medicine & Care — 医院药物护理（1.6 官方/社区共识值）

# 药物治疗效果（tendPotency 约值）：决定治疗质量
medicines:
  - { name: "Herbal medicine",   potency: 0.6, note: "Low quality, cheap" }
  - { name: "Medicine (industrial)", potency: 1.0, note: "Standard" }
  - { name: "Glitterworld medicine", potency: 1.3, note: "Best, expensive" }

# 医疗设施加成
facilities:
  - { name: "No special bed",          tend_speed: 1.0, surgery: 1.0, note: "Any bed" }
  - { name: "Hospital bed",            tend_speed: 1.4, surgery: 1.2, note: "Medical rest" }
  - { name: "Hospital bed + vitals monitor", tend_speed: 1.9, surgery: 1.5, note: "Best setup" }

# 护理技能（0-20）对治疗质量的加成：quality = potency × (0.8 + skill×0.02)，标注 baseline
# 免疫进展基线：~0.16/天（healthy pawn），疾病严重度每天增加 ~0.15（约值）
care_baseline:
  immunity_per_day: 0.16
  severity_gain_per_day: 0.15
  medicine_units_per_tend: 1
