# RimWorld Hydroponics & Sun Lamp — 水培与太阳灯规划（1.6 社区共识值）
# 数值为官方 Def / Wiki 共识 baseline；mods 与 DLC 可能改变实际值

sun_lamps:
  - { name: "Sun lamp",      radius: 11.9,  usable_tiles: 100,  power: 290, note: "Covers ~100 growable tiles around lamp column" }

basins:
  - { name: "Hydroponics basin", power: 70, growth_mult: 2.3, fertility: 1.8, note: "Needs power + lit sun lamp" }
  - { name: "Soil patch",        power: 0,  growth_mult: 1.0, fertility: 1.0, note: "Baseline outdoor soil" }

# 可水培作物（plantable in hydroponics，1.6 口径）
crops:
  - { name: "Rice",          grow_days: 5,  yield: 4,  nutrition: 0.05, note: "Fastest, standard hydroponics pick" }
  - { name: "Potatoes",      grow_days: 9,  yield: 8,  nutrition: 0.05, note: "Good yield, tolerant" }
  - { name: "Corn",          grow_days: 17, yield: 17, nutrition: 0.05, note: "Best per tile, long grow" }
  - { name: "Strawberries",  grow_days: 9,  yield: 6,  nutrition: 0.05, note: "Perennial, no replant" }
  - { name: "Cotton",        grow_days: 9,  yield: 6,  nutrition: 0.0,  note: "Fabric source" }
  - { name: "Healroot",      grow_days: 14, yield: 4,  nutrition: 0.0,  note: "Medicine ingredient" }
  - { name: "Smokeleaf",     grow_days: 11, yield: 6,  nutrition: 0.0,  note: "Drug crop" }
  - { name: "Psychoid",      grow_days: 16, yield: 8,  nutrition: 0.0,  note: "Drug crop (psychite)" }

# 一日营养需求
nutrition_per_colonist_per_day: 1.6
